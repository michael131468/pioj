services:
  pioj:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
      # Mount data directory for persistent storage
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

